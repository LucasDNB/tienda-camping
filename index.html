<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Camping | Equipamiento Técnico Outdoor</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header & Navegación -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo-area">
        <span class="logo-icon">⛺</span>
        <span>CAMPING STORE</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Catálogo</a>
        <a href="cart.html" style="position: relative;">
          🛒 Carrito
          <span id="cart-count-badge" class="cart-badge" style="display: none;">0</span>
        </a>
        <div id="nav-auth" style="display: flex; align-items: center; gap: 0.75rem;"></div>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="main-container">
    <section class="hero">
      <h1>Equipamiento Técnico para Aventuras Extremas</h1>
      <p>Carpas de alta montaña, bolsas de dormir para frío extremo, mochilas ergonómicas y linternas recargables con disponibilidad de inventario en tiempo real.</p>
    </section>

    <div class="catalog-layout">
      <!-- Filtros Laterales (RF-05) -->
      <aside class="filters-card">
        <h3>Filtros de Búsqueda</h3>
        <form id="filter-form">
          <div class="filter-group">
            <label for="filter-search">Buscar artículo:</label>
            <input type="text" id="filter-search" placeholder="ej. Carpa, Plumón, 800 Lumens..." />
          </div>

          <div class="filter-group">
            <label for="filter-category">Categoría:</label>
            <select id="filter-category">
              <option value="">Todas las categorías</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Rango de Precio (USD):</label>
            <div class="price-range-inputs">
              <input type="number" id="filter-min-price" placeholder="Mín" min="0" />
              <span>-</span>
              <input type="number" id="filter-max-price" placeholder="Máx" min="0" />
            </div>
          </div>

          <div class="filter-group">
            <label for="filter-sort">Ordenar por:</label>
            <select id="filter-sort">
              <option value="newest">Más recientes</option>
              <option value="price_asc">Precio: Menor a Mayor</option>
              <option value="price_desc">Precio: Mayor a Menor</option>
              <option value="name_asc">Nombre: A - Z</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Aplicar Filtros</button>
        </form>
      </aside>

      <!-- Grilla de Productos (RF-05, RF-06) -->
      <section>
        <div id="products-grid" class="products-grid">
          <!-- Inyectado dinámicamente por app.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- Modal de Detalle de Producto (RF-06) -->
  <div id="product-detail-modal"></div>

  <script src="js/app.js"></script>
</body>
</html>
